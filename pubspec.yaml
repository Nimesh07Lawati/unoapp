name: unoapp
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_svg: ^2.0.10
  flutter_gen: ^5.13.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.13.0+1
  build_runner: ^2.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/store_images/
    - assets/icons/
    - assets/icons/nav_bar_icons/
    - assets/fonts/PublicSans-Regular.ttf
    - assets/fonts/PublicSans-SemiBold.ttf
    - assets/application_images/

flutter_gen:
  output: lib/gen/ # Where the generated files will live
  integrations:
    flutter_svg: true 

  colors:
    inputs:
      - assets/colors/colors.xml
  