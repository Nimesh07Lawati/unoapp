name: unoapp
description: "A new Flutter project."
publish_to: 'none' 
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^17.0.0
  flutter_svg: ^2.0.10
  flutter_gen: ^5.13.0+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_gen_runner: ^5.13.0+1
  build_runner: ^2.13.1
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#D42B65"  
  adaptive_icon_foreground: "assets/icons/app_icon.png"
  adaptive_icon_foreground_scale: 0.65
  web:
    generate: false
  windows:
    generate: false
  macos:
    generate: false  

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/store_images/
    - assets/icons/
    - assets/icons/nav_bar_icons/
    - assets/fonts/PublicSans-Regular.ttf
    - assets/fonts/PublicSans-SemiBold.ttf
    - assets/application_images/

flutter_gen:
  output: lib/gen/ # Where the generated files will live
  integrations:
    flutter_svg: true 
    

  colors:
    inputs:
      - assets/colors/colors.xml
  